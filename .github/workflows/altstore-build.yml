name: "AltStore IPA Builder"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Files Safely
        run: |
          mkdir -p raw_assets
          # Unzip your uploaded archive cleanly
          unzip -q *.zip -d raw_assets || echo "No zip found"

      - name: Build Proper iOS Structure
        run: |
          # Create a strict, proper Apple Payload structure
          mkdir -p Payload/YourApp.app
          
          # Move all your assets directly into the app structure
          cp -R raw_assets/* Payload/YourApp.app/
          
          # Package the Payload folder strictly into an iOS compliant IPA
          zip -qr app-release.ipa Payload

      - name: Upload Valid IPA
        uses: actions/upload-artifact@v4
        with:
          name: valid-altstore-ipa
          path: app-release.ipa
